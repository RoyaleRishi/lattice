# M3 (spec §6), collapsed single-config: exact-label resolver on ConEL-2 gold
# mentions. Collapsed from configs/m3-conel2-sweep.toml's [base.*] + the
# exact-label axis option, for item-level bootstrap CI via
# `python -m lattice.harness.stats` (Task 10/11).

[segmenter]
name = "block"

[extractor]
name = "gold-mentions"
[extractor.params]
root = "data/conel2"
split = "test"

[scorer]
name = "passthrough"

[resolver]
name = "exact-label"

[relation_inducer]
name = "co-occurrence"

[graph_integrator]
name = "in-memory"

[embedder]
name = "sentence-transformer"

[concept_store]
name = "in-memory"

[run]
on_error = "fail"
seed = 0

[dataset]
name = "mention-clusters"
[dataset.params]
root = "data/conel2"
split = "test"

[[document_metrics]]
name = "clustering"
