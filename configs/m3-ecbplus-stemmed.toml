# M3 normalization sweep (spec §6): exact-label vs stemmed-label vs
# embedding-nn@0.90 on ECB+ gold mentions -- the honest three-way identity
# comparison (review finding: embedding-nn@0.90 makes only 7/452 merges
# beyond exact-label on ConEL-2, and stemmed-label reproduces 6 of those 7).
# The gold-mentions extractor + block segmenter pairing is load-bearing:
# converters emit single-newline text -> one unit per document.

[base.segmenter]
name = "block"

[base.extractor]
name = "gold-mentions"
[base.extractor.params]
root = "data/ecbplus"
split = "test"

[base.scorer]
name = "passthrough"

[base.resolver]
name = "exact-label"

[base.relation_inducer]
name = "co-occurrence"

[base.graph_integrator]
name = "in-memory"

[base.embedder]
name = "sentence-transformer"

[base.concept_store]
name = "in-memory"

[base.run]
on_error = "fail"
seed = 0

[base.dataset]
name = "mention-clusters"
[base.dataset.params]
root = "data/ecbplus"
split = "test"

[[base.document_metrics]]
name = "clustering"

[axes]
resolver = [
  { name = "exact-label" },
  { name = "stemmed-label" },
  { name = "embedding-nn", params = { threshold = 0.90 } },
]
